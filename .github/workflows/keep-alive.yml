# NBS SOFT MUSIC — не даёт сайту на Streamlit Cloud уснуть.
# Каждые 4 часа открывает сайт в настоящем браузере; если сайт уснул — нажимает кнопку «разбудить».
name: keep-alive

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch: {}      # кнопка «Run workflow» для ручной проверки

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Playwright
        run: |
          pip install playwright==1.47.0
          python -m playwright install --with-deps chromium
      - name: Visit the site
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          python - <<'EOF'
          import os, sys
          from playwright.sync_api import sync_playwright
          url = os.environ.get("APP_URL", "").strip()
          if not url:
              sys.exit("Добавьте секрет APP_URL: Settings → Secrets and variables → Actions")
          with sync_playwright() as p:
              page = p.chromium.launch().new_page()
              page.goto(url, timeout=90_000)
              page.wait_for_timeout(8_000)
              wake = page.get_by_role("button", name="Yes, get this app back up!")
              if wake.count():
                  wake.first.click()
                  print("Сайт спал — разбудили")
                  page.wait_for_timeout(60_000)
              else:
                  print("Сайт работает")
          EOF
